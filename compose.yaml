services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oma_one
      POSTGRES_USER: oma
      POSTGRES_PASSWORD: oma
    ports:
      - "${OMA_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oma -d oma_one"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - oma_one_postgres:/var/lib/postgresql/data

volumes:
  oma_one_postgres:
